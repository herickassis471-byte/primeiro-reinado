<style>
#abertura-real {
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:hidden;
  background:#14202a;
  font-family:Georgia,serif;
  transition:opacity 1.5s,visibility 1.5s;
}

#abertura-real.saindo {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.ceu-real {
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,#18283a 0%,#536879 43%,#c49a70 80%,#a77d56 100%
  );
}

.sol-real {
  position:absolute;
  top:15%;
  right:17%;
  width:clamp(70px,12vw,145px);
  aspect-ratio:1;
  border-radius:50%;
  background:#f2d19a;
  box-shadow:0 0 50px 20px #f4d29b66;
}

.luz-sol {
  position:absolute;
  top:15%;
  right:5%;
  width:50%;
  height:65%;
  background:radial-gradient(ellipse,#f3d5a255,transparent 70%);
}

.nuvens {
  position:absolute;
  inset:0;
  opacity:.32;
  background:
    radial-gradient(ellipse at 15% 22%,#c4c5bd 0 4%,transparent 15%),
    radial-gradient(ellipse at 40% 16%,#aeb9bb 0 5%,transparent 18%),
    radial-gradient(ellipse at 75% 33%,#d2c2a6 0 4%,transparent 15%);
  filter:blur(13px);
  animation:nuvens-mover 35s linear infinite alternate;
}

@keyframes nuvens-mover {
  to {transform:translateX(60px)}
}

.paisagem {
  position:absolute;
  bottom:19%;
  width:100%;
  height:48%;
}

.oceano {
  position:absolute;
  bottom:0;
  width:100%;
  height:37%;
  overflow:hidden;
  background:linear-gradient(#456676,#1c3848 75%,#102633);
  border-top:2px solid #e5c18c88;
}

.reflexo-sol {
  position:absolute;
  width:28%;
  height:100%;
  right:12%;
  top:0;
  background:linear-gradient(180deg,#f4d29b55,transparent);
  filter:blur(18px);
}

.onda-real {
  position:absolute;
  width:150%;
  left:-25%;
  height:45px;
  border-top:2px solid #d7e5e477;
  border-radius:50%;
  animation:mar-real 7s ease-in-out infinite alternate;
}

.onda-b {top:25%;animation-duration:9s;opacity:.55}
.onda-c {top:48%;animation-duration:6s;opacity:.45}
.onda-d {top:70%;animation-duration:8s;opacity:.4}
.onda-e {top:90%;animation-duration:5s;opacity:.3}

@keyframes mar-real {
  to {transform:translateX(5%) translateY(12px)}
}

#navio-real {
  position:absolute;
  width:min(850px,90vw);
  left:-75%;
  bottom:18%;
  z-index:3;
  animation:navio-chegando 7s cubic-bezier(.2,.6,.25,1) forwards;
  filter:drop-shadow(0 18px 15px #07131c88);
}

#navio-real svg {
  width:100%;
  display:block;
}

@keyframes navio-chegando {
  0% {left:-75%;transform:translateY(0) rotate(-2deg)}
  65% {left:28%;transform:translateY(4px) rotate(1deg)}
  82% {left:35%;transform:translateY(-2px) rotate(-.5deg)}
  100% {left:35%;transform:translateY(0) rotate(0)}
}

#desembarque-real {
  position:absolute;
  z-index:4;
  left:52%;
  bottom:17%;
  display:flex;
  gap:23px;
  opacity:0;
  animation:pessoas-chegando 3s 6.5s forwards;
}

.pessoa-real {
  position:relative;
  width:13px;
  height:48px;
  border-radius:8px 8px 2px 2px;
  background:#171a1c;
  transform-origin:top;
}

.pessoa-real:before {
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  top:-15px;
  left:-1px;
  background:#171a1c;
}

.pessoa-real:after {
  content:"";
  position:absolute;
  height:32px;
  width:5px;
  background:#171a1c;
  bottom:-27px;
  left:2px;
  box-shadow:7px 0 #171a1c;
}

.pessoa-2 {height:43px}
.pessoa-3 {height:50px}
.pessoa-4 {height:45px}

@keyframes pessoas-chegando {
  0% {opacity:0;transform:translateX(-20px)}
  20% {opacity:1}
  100% {opacity:1;transform:translateX(65px)}
}

#titulo-real {
  position:absolute;
  z-index:8;
  top:50%;
  left:50%;
  width:95%;
  text-align:center;
  transform:translate(-50%,-40%);
  opacity:0;
  transition:opacity 1s,transform 1s;
}

#titulo-real.aparecer {
  opacity:1;
  transform:translate(-50%,-50%);
}

.subtitulo-real {
  font-family:Arial,sans-serif;
  color:#f1d09a;
  letter-spacing:6px;
  font-size:11px;
}

#letras-reais {
  font-size:clamp(32px,7vw,86px);
  color:#fff0d0;
  letter-spacing:clamp(1px,.8vw,8px);
  text-shadow:0 8px 35px #000,0 0 35px #e5bd7255;
  margin:25px 0;
}

#letras-reais span {
  display:inline-block;
  opacity:0;
  animation:letra-real 1.1s cubic-bezier(.15,.8,.25,1.2) forwards;
}

@keyframes letra-real {
  0% {opacity:0;transform:translateY(-100vh) rotate(20deg)}
  70% {opacity:1;transform:translateY(12px) rotate(-4deg)}
  100% {opacity:1;transform:translateY(0) rotate(0)}
}

.linha-real {
  width:150px;
  height:2px;
  margin:20px auto;
  background:linear-gradient(90deg,transparent,#e5bd72,transparent);
}

#titulo-real p {
  color:#f1d5ad;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:4px;
}

.vinheta-real {
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  box-shadow:inset 0 0 180px #02070dbb;
}

#pular-real {
  position:absolute;
  right:22px;
  bottom:20px;
  z-index:10;
  background:#101722bb;
  color:#f5dfb5;
  border:1px solid #d5ad70;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
}

@media(max-width:600px) {
  #navio-real {width:115vw;bottom:21%}
  #desembarque-real {bottom:17%;left:47%;gap:15px}
  .subtitulo-real {letter-spacing:3px}
}
</style>

<script>
const letrasReais = document.getElementById("letras-reais");

[..."PRIMEIRO REINADO"].forEach((letra,i) => {
  const span = document.createElement("span");
  span.innerHTML = letra === " " ? "&nbsp;" : letra;
  span.style.animationDelay = (i * 0.09) + "s";
  letrasReais.appendChild(span);
});

let aberturaFinalizada = false;

function finalizarAberturaReal() {
  if(aberturaFinalizada) return;
  aberturaFinalizada = true;

  const tela = document.getElementById("abertura-real");
  tela.classList.add("saindo");

  setTimeout(() => tela.remove(),1500);
}

setTimeout(() => {
  document.getElementById("titulo-real").classList.add("aparecer");
},8500);

setTimeout(finalizarAberturaReal,13500);
</script>
